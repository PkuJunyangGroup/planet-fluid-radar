name: Update literature and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: literature-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test filtering and recovery
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Update public literature
        id: fetch
        continue-on-error: true
        run: python update.py --days 7
      - name: Enrich introductions, affiliations and dates
        run: |
          python enrich.py --limit 60
          python dates.py --limit 60
      - name: Save updated records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers.json affiliations.json dates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update literature records'
            git push
          fi
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html app.js style.css favicon.svg papers.json sources.html sources.js _site/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures after publishing status
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'One or more sources failed. Website published with accurate source status; next run will retry.'
          exit 1
